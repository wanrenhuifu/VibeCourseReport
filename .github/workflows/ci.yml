name: CI

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'scripts/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

jobs:
  check-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install CJK fonts (prevents tofu/方块)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install Chromium
        run: |
          npx puppeteer browsers install chrome

      - name: Run structure check
        run: npm run check

      - name: Export PDF
        run: npm run export:pdf
        env:
          CHROME_PATH: ${{ github.workspace }}/chrome-headless-shell/linux-134.0.6998.35/chrome-headless-shell-linux64/chrome-headless-shell

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibe-course-report-demo
          path: export/vibe-course-report-demo.pdf
          retention-days: 7
