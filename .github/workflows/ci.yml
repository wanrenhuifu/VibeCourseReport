name: CI

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'scripts/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.gitattributes'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

jobs:
  check-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 浏览器用 runner 镜像预装的 Google Chrome（/usr/bin/google-chrome，
      # export-pdf.mjs 的 findChrome() 会自动探测），不装 chromium-browser——
      # Ubuntu 上它是 snap 过渡包，Actions runner 没有 snapd，装不上。
      - name: Install CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Run structure check
        run: npm run check

      - name: Export PDF
        run: npm run export:pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibe-course-report-demo
          path: export/vibe-course-report-demo.pdf
          retention-days: 7
