name: CI

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'scripts/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.gitattributes'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

jobs:
  check-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 浏览器用 runner 镜像预装的 Google Chrome（/usr/bin/google-chrome，
      # export-pdf.mjs 的 findChrome() 会自动探测），不装 chromium-browser——
      # Ubuntu 上它是 snap 过渡包，Actions runner 没有 snapd，装不上。
      - name: Install CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Run structure check
        run: npm run check

      # 重新生成预览截图，验证截图管线在 CI 中可用（字体齐全 → 无 tofu 告警、资源齐全 →
      # 无缺失资源告警、退出码 0）。preview.png 与源文件的"同步性"已由上面的 npm run check
      # 依据 assets/preview.sources.json 强制校验（源文件变更后未重跑截图会使 check 失败），
      # 这里不再做像素级比对——不同平台的字体渲染存在合法差异。
      - name: Regenerate preview screenshot
        run: npm run screenshot

      - name: Export PDF
        run: npm run export:pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibe-course-report-demo
          path: export/vibe-course-report-demo.pdf
          retention-days: 7
